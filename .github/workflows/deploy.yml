name: Deploy to Cloudflare Workers

# Phase 0 (2026-09-02): the weekly Tuesday schedule is DISABLED.
# The full-replace GeoIP import writes ~1.95M rows per run (19.5x the D1 free
# daily quota of 100k) and has hard-failed since Cloudflare's 2026-09-01
# enforcement change, leaking one orphan database per failed run.
# Data updates will resume via the daily convergence job (migration plan,
# Phase 3-5); until then this workflow is manual-only.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          worker-only: deploy the Worker with the current wrangler.toml binding.
          full: legacy GeoIP full-replace import + deploy (fails the D1 free
          quota; keep only for emergencies under a paid plan).
        type: choice
        options:
          - worker-only
          - full
        default: worker-only
      cutover_live:
        description: >-
          P4 cutover (worker-only mode): verify geoip_live_weur bootstrap is
          complete, bind it in wrangler.toml, deploy, and commit the binding
          back to the repository. One-time switch from the legacy dated DB.
        type: boolean
        default: false

concurrency:
  group: geoip-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/setup-python@v7
        if: inputs.mode == 'full'
        with:
          python-version: '3.11'

      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache pip dependencies
        if: inputs.mode == 'full'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-maxminddb
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          if [ "${{ inputs.mode }}" = "full" ]; then pip install --only-binary :all: maxminddb==3.1.1; fi

      - name: Import GeoIP data (legacy full-replace; quota-failing on free plan)
        if: inputs.mode == 'full'
        run: ./import-geoip.sh
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKERS_DEV: 'true'

      - name: Move wrangler config
        if: inputs.mode == 'full'
        run: mv tmp/legacy_import/wrangler.toml .

      - name: P4 cutover — bind geoip_live_weur (verified)
        if: inputs.cutover_live && inputs.mode == 'worker-only'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          UUID=$(npx --no-install wrangler d1 info geoip_live_weur --json | jq -r '.uuid // empty')
          if [[ -z "$UUID" ]]; then
            echo "Could not resolve geoip_live_weur uuid — refusing cutover" >&2
            exit 1
          fi
          # Bootstrap must be complete: meta.source_tag present => whole dataset
          # applied and verified (the sync job writes it LAST).
          TAG=$(npx --no-install wrangler d1 execute geoip_live_weur -y --remote --json \
            --command "SELECT value FROM meta WHERE key='source_tag'" \
            | jq -r '.[0].results[0].value // empty')
          if [[ -z "$TAG" ]]; then
            echo "geoip_live_weur bootstrap not complete (no meta.source_tag) — refusing cutover" >&2
            exit 1
          fi
          echo "Cutover: geoip_live_weur uuid=$UUID source_tag=$TAG"
          sed -i -e "s/^database_name =.*/database_name = \"geoip_live_weur\"/" \
                 -e "s/^database_id =.*/database_id = \"$UUID\"/" wrangler.toml

      - name: Deploy Worker
        run: npm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Persist cutover binding to repository
        if: inputs.cutover_live && inputs.mode == 'worker-only'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wrangler.toml
          if git diff --cached --quiet; then
            echo "Binding already current — nothing to persist"
          else
            git commit -m "ci: P4 cutover — bind geoip_live_weur (bootstrap verified before deploy)"
            git push
          fi

      - name: Update release branch
        if: inputs.mode == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release && cd release
          DATE=$(date)
          echo "$DATE" > release
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add -A
          git commit -m "$DATE"
          # Token travels in an auth header, never in the remote URL (git
          # error output echoes URLs; Sonar S6505-class credential leak).
          git remote add origin "https://github.com/${{ github.repository }}"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="Authorization: Basic $AUTH" push -f -u origin release

      - name: Ping dead-man switch
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsS --retry 3 "$HC_URL" || true
          fi
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_PING_URL }}

  notify-failure:
    needs: deploy
    if: failure()
    runs-on: ubuntu-26.04
    permissions:
      issues: write
    steps:
      - name: Open a failure issue (deduplicated)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create ci-failure --repo "$GITHUB_REPOSITORY" --color B60205 --description "CI pipeline failure" 2>/dev/null || true
          OPEN_COUNT=$(gh issue list --repo "$GITHUB_REPOSITORY" --label ci-failure --state open --json number --jq length)
          if [ "$OPEN_COUNT" = "0" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "CI failure: $GITHUB_WORKFLOW run #$GITHUB_RUN_NUMBER" \
              --label ci-failure \
              --body "Workflow run failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
